[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "funda-scraper"
version = "1.3.0"
description = "Funda property scraper with local browser sessions and offline extraction"
readme = "README.md"
requires-python = ">=3.9,<3.14"
license = "GPL-3.0-only"
authors = [{name = "Will Chien"}]
dependencies = [
  "beautifulsoup4>=4.12,<5", "requests>=2.32,<3", "diot>=0.1.8,<1",
  "PyYAML>=6,<7", "tqdm>=4.66,<5", "pandas>=2.2,<3",
  "numpy>=1.26,<3", "lxml>=5,<7", "python-dateutil>=2.8,<3",
]

[project.optional-dependencies]
browser = ["camoufox==0.4.11", "playwright>=1.58,<1.63"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1", "build>=1,<2"]

[project.scripts]
funda-scraper = "funda_scraper.cli:main"

[project.urls]
Repository = "https://github.com/maartenesser/funda-scraper"
Upstream = "https://github.com/whchien/funda-scraper"

[tool.setuptools.packages.find]
include = ["funda_scraper*"]

[tool.setuptools.package-data]
funda_scraper = ["config/*.yaml", "VERSION"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
